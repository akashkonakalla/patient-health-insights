spring.application.name=PatientHealthInsights

server.port = 8888

spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/patient_health_insights
spring.datasource.username = springuser
spring.datasource.password = springuser

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hivernate.format_sql = true